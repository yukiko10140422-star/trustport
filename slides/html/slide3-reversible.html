<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/slides/html/common.css">
<style>
  .slide {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* 左: 画像 */
  .image-left {
    position: relative;
    overflow: hidden;
  }
  .image-left img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .image-left::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 200px;
    height: 100%;
    background: linear-gradient(270deg, var(--dark-bg) 0%, transparent 100%);
    z-index: 1;
  }

  /* 右: コンテンツ */
  .content-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 80px 80px 60px;
    background: var(--dark-bg);
  }

  .title {
    font-family: 'Inter', sans-serif;
    font-size: 56px;
    font-weight: 900;
    line-height: 1.15;
    background: linear-gradient(135deg, #ffffff 0%, var(--ivory) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .concept-label {
    font-size: 20px;
    font-weight: 500;
    color: var(--gold);
    margin-bottom: 40px;
    letter-spacing: 1px;
  }

  .sides-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
  }

  .side-box {
    padding: 28px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .side-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .side-a .side-label { color: var(--teal); }
  .side-b .side-label { color: var(--terracotta); }

  .side-title {
    font-size: 20px;
    font-weight: 700;
    color: white;
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .side-desc {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-muted);
  }

  .arrow-container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 24px 0;
    gap: 12px;
  }

  .arrow-line {
    width: 80px;
    height: 2px;
    background: linear-gradient(90deg, var(--teal), var(--terracotta));
  }

  .arrow-text {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="image-left">
      <img src="/outputs/images/reversible-design-concept.png" alt="Reversible Design">
    </div>
    <div class="content-right">
      <div class="section-label">Core Concept</div>
      <div class="title">REVERSIBLE<br>DESIGN</div>
      <div class="concept-label">1着で2つの物語を纏う</div>

      <div class="arrow-container">
        <div class="arrow-line"></div>
        <div class="arrow-text">Two Styles in One</div>
        <div class="arrow-line"></div>
      </div>

      <div class="sides-container">
        <div class="side-box side-a">
          <div class="side-label">Side A</div>
          <div class="side-title">The Present<br>Moment of Beauty</div>
          <div class="side-desc">現代のエレガンスとモダンデザイン。日常に溶け込む洗練されたスタイル</div>
        </div>
        <div class="side-box side-b">
          <div class="side-label">Side B</div>
          <div class="side-title">Memories<br>of the Past</div>
          <div class="side-desc">被災地の風景をデジタルアーカイブしたヴィンテージプリント。記憶を纏う</div>
        </div>
      </div>
    </div>
    <div class="brand-bar"></div>
    <div class="slide-number">03 / 07</div>
  </div>
</body>
</html>
