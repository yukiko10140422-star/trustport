<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/slides/html/common.css">
<style>
  .slide {
    background-color: #070710;
    background-image:
      radial-gradient(ellipse 80% 60% at 15% 20%, rgba(30, 15, 60, 0.8) 0%, transparent 70%),
      radial-gradient(ellipse 60% 50% at 85% 75%, rgba(15, 25, 60, 0.6) 0%, transparent 65%),
      radial-gradient(ellipse 40% 35% at 50% 50%, rgba(80, 50, 20, 0.15) 0%, transparent 60%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
    opacity: 0.03;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 5;
  }

  /* 装飾リング */
  .deco-ring-1 {
    position: absolute;
    width: 700px; height: 700px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.03);
    top: -150px; right: -100px;
  }
  .deco-ring-2 {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    border: 1px solid rgba(212,165,116,0.05);
    bottom: -100px; left: -80px;
  }

  /* ライトリーク */
  .light-leak {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(42,157,143,0.06) 0%, transparent 70%);
    filter: blur(60px);
    top: 20%; right: 10%;
    pointer-events: none;
  }

  .center-content {
    text-align: center;
    z-index: 10;
    max-width: 1200px;
  }

  .brand-name {
    font-family: 'Inter', sans-serif;
    font-size: 120px;
    font-weight: 900;
    letter-spacing: 24px;
    background: linear-gradient(135deg, #ffffff 0%, var(--ivory) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    margin-bottom: 24px;
    line-height: 1.1;
  }

  .tagline {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 36px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 8px;
    margin-bottom: 64px;
  }

  .divider-center {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    box-shadow: 0 0 8px rgba(42,157,143,0.4), 0 0 24px rgba(42,157,143,0.15);
    border-radius: 2px;
    margin: 0 auto 64px;
  }

  .subtitle {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
    line-height: 1.8;
  }

  .date-label {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 300;
    color: rgba(255,255,255,0.2);
    letter-spacing: 4px;
    z-index: 10;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="deco-ring-1"></div>
  <div class="deco-ring-2"></div>
  <div class="light-leak"></div>

  <div class="center-content">
    <div class="brand-name">YURA</div>
    <div class="tagline">記憶の揺らぎを、力に変える。</div>
    <div class="divider-center"></div>
    <div class="subtitle">
      アパレル事業 総合リサーチ &amp; ブランド戦略
    </div>
  </div>

  <div class="date-label">OTHRE SERVICE / MARCH 2026</div>
  <div class="brand-bar"></div>
</div>
</body>
</html>
