<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/slides/html/common.css">
<style>
  .slide {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 80px;
  }
  .left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 64px;
    z-index: 6;
    position: relative;
  }
  .right {
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
    position: relative;
  }
  h2 {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 44px;
    font-weight: 900;
    line-height: 1.3;
    color: var(--text-primary);
    margin-bottom: 24px;
  }
  h2 span { color: var(--gold); }
  .desc {
    font-size: 20px;
    line-height: 1.9;
    color: var(--text-body);
    margin-bottom: 32px;
  }
  /* Venn diagram */
  .venn-container {
    position: relative;
    width: 520px;
    height: 460px;
  }
  .venn-circle {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 1px;
  }
  .venn-disaster {
    top: 0; left: 50%;
    transform: translateX(-50%);
    background: rgba(42,157,143,0.2);
    border: 1px solid rgba(42,157,143,0.4);
  }
  .venn-digital {
    bottom: 30px; left: 0;
    background: rgba(139,126,200,0.2);
    border: 1px solid rgba(139,126,200,0.4);
  }
  .venn-fashion {
    bottom: 30px; right: 0;
    background: rgba(212,165,116,0.2);
    border: 1px solid rgba(212,165,116,0.4);
  }
  .venn-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -40%);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212,165,116,0.5);
    letter-spacing: 4px;
  }
  .pillar-cards {
    display: flex;
    gap: 16px;
    margin-top: 8px;
  }
  .pillar {
    flex: 1;
    padding: 20px 16px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-top-color: var(--card-border-top);
    text-align: center;
  }
  .pillar-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pillar-icon svg { stroke: var(--teal); }
  .pillar-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .pillar-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="left">
      <div class="section-label">BRAND CONCEPT</div>
      <h2><span>記憶の揺らぎ</span>を<br>力に変える</h2>
      <div class="desc">
        災害で失われた風景をデジタルで保存し、<br>
        ファッションという日常的なメディアを通じて<br>
        <strong>「風化」に抗う</strong>新しいブランド。
      </div>
      <div class="pillar-cards">
        <div class="pillar">
          <div class="pillar-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="pillar-title">被災地支援</div>
          <div class="pillar-desc">売上の10-15%を<br>復興支援に充当</div>
        </div>
        <div class="pillar">
          <div class="pillar-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </div>
          <div class="pillar-title">デジタルアーカイブ</div>
          <div class="pillar-desc">QR/NFCで風景を<br>永続的に保存</div>
        </div>
        <div class="pillar">
          <div class="pillar-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          </div>
          <div class="pillar-title">ファッション</div>
          <div class="pillar-desc">日常に溶け込む<br>アートプリント</div>
        </div>
      </div>
    </div>
    <div class="right">
      <div class="venn-container">
        <div class="venn-circle venn-disaster">
          <span>被災地<br>風化防止</span>
        </div>
        <div class="venn-circle venn-digital">
          <span>デジタル<br>アーカイブ</span>
        </div>
        <div class="venn-circle venn-fashion">
          <span>アパレル<br>ファッション</span>
        </div>
        <div class="venn-center">YURA</div>
      </div>
    </div>
    <div class="slide-number">02 / 12</div>
    <div class="brand-bar"></div>
  </div>
</body>
</html>
