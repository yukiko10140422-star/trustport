<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/slides/html/common.css">
<style>
  .slide {
    display: grid;
    grid-template-columns: 0.45fr 1.1fr 0.45fr;
    background: linear-gradient(135deg, var(--dark-bg) 0%, #16213e 100%);
  }

  /* 左: 画像（小さめ） */
  .image-col {
    position: relative;
    overflow: hidden;
  }
  .image-col img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .image-col::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px;
    height: 100%;
    background: linear-gradient(270deg, var(--dark-bg) 0%, transparent 100%);
    z-index: 1;
  }

  /* 中央: メインコンテンツ */
  .content-center {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 60px;
  }

  .title {
    font-family: 'Inter', sans-serif;
    font-size: 60px;
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #ffffff 0%, var(--ivory) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 22px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 48px;
  }

  .model-flow {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-bottom: 40px;
  }

  .model-step {
    flex: 1;
    padding: 32px 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }

  .model-step:first-child { border-radius: 12px 0 0 12px; }
  .model-step:last-child { border-radius: 0 12px 12px 0; }

  .step-number {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .model-step:nth-child(1) .step-number { color: var(--teal); }
  .model-step:nth-child(2) .step-number { color: var(--terracotta); }
  .model-step:nth-child(3) .step-number { color: var(--gold); }

  .step-title {
    font-size: 20px;
    font-weight: 700;
    color: white;
    margin-bottom: 12px;
  }

  .step-desc {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  .model-arrow {
    display: flex;
    align-items: center;
    padding: 0 4px;
    color: rgba(255,255,255,0.25);
    font-size: 24px;
  }

  .bottom-note {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.7;
    padding: 24px 32px;
    background: rgba(255,255,255,0.03);
    border-radius: 12px;
    border-left: 3px solid var(--teal);
  }

  /* 右: 装飾画像 */
  .decor-col {
    position: relative;
    overflow: hidden;
  }
  .decor-col img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.6;
  }
  .decor-col::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 120px;
    height: 100%;
    background: linear-gradient(90deg, var(--dark-bg) 0%, transparent 100%);
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="image-col">
      <img src="/outputs/images/business-model.png" alt="Business Model">
    </div>

    <div class="content-center">
      <div class="section-label">Revenue Model</div>
      <div class="title">BUSINESS<br>MODEL</div>
      <div class="subtitle">D2C + クラウドファンディング + 寄付モデル</div>

      <div class="model-flow">
        <div class="model-step">
          <div class="step-number">Phase 1</div>
          <div class="step-title">Makuake CF</div>
          <div class="step-desc">クラウドファンディングで初期資金調達とファン獲得</div>
        </div>
        <div class="model-arrow">&#9654;</div>
        <div class="model-step">
          <div class="step-number">Phase 2</div>
          <div class="step-title">D2C Shopify</div>
          <div class="step-desc">自社ECで直販。ブランドストーリーを直接届ける</div>
        </div>
        <div class="model-arrow">&#9654;</div>
        <div class="model-step">
          <div class="step-number">Phase 3</div>
          <div class="step-title">寄付モデル</div>
          <div class="step-desc">売上の一部を被災地のデジタルアーカイブ事業に還元</div>
        </div>
      </div>

      <div class="bottom-note">
        <strong>収益構造:</strong> 製品販売（D2C 70%） + コラボレーション（20%） + アーカイブライセンス（10%）
      </div>
    </div>

    <div class="decor-col">
      <img src="/outputs/images/brand-mission.png" alt="Decor">
    </div>

    <div class="brand-bar"></div>
    <div class="slide-number">06 / 07</div>
  </div>
</body>
</html>
